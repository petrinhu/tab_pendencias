name: CI

# CI-1 (TODO.md): um unico workflow, varios jobs -- nao workflows separados.
# Cada job cobre uma fatia do catalogo de testes (TESTES.md) ou um guard
# especifico deste produto. Ver comentario de cada job para o motivo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permissoes minimas: leitura apenas, nenhum job escreve no repo/PR. As
# actions de terceiro (checkout, setup-python, markdownlint-cli2-action,
# gitleaks-action) sao a UNICA dependencia de codigo de terceiro executado
# neste repo -- por isso pinadas por SHA de commit abaixo, nunca por tag
# movel (uma tag pode ser repontada; um SHA de commit, nao).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Job 1: pytest na matrix ubuntu + windows.
  #
  # Obrigatorio nas DUAS imagens: o produto promete rodar em qualquer SO
  # onde o Claude Code roda (D-11/ADR-1 secao (e)) -- um job so-ubuntu
  # deixaria a promessa de agnosticismo de SO sem verificacao nenhuma. Se
  # algum teste nao puder rodar no Windows, ele e SKIPADO com motivo
  # explicito (pytest.mark.skipif com reason=), nunca excluido em silencio
  # da colecao (nenhum teste hoje usa skipif -- os 41 rodam nas duas
  # imagens, ver relatorio de validacao local).
  # ---------------------------------------------------------------------
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de teste
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------
  # Job 1b (CI-2): pytest em Debian, Fedora e Arch via CONTAINER sobre o
  # runner ubuntu-latest (o GitHub nao tem runner nativo dessas distros).
  # Acrescenta cobertura ao job 1 (ubuntu + windows nativos), nao substitui.
  #
  # Valor tecnico real, nao simbolismo:
  #   1. CORRECAO 2026-07-28: /bin/sh no Ubuntu (job "shellcheck-and-smoke"
  #      abaixo, ubuntu-latest) JA E dash, igual ao Debian -- confirmado
  #      localmente (`readlink -f /bin/sh` -> dash nas duas imagens). Ou
  #      seja, o smoke dos shims sob Debian NAO adiciona uma 1a exposicao a
  #      shell POSIX estrito que nao existisse antes -- essa premissa
  #      original (Ubuntu roda em bash) estava errada e foi corrigida aqui
  #      em vez de propagada. O smoke roda no Debian mesmo assim (pedido
  #      explicito do lider), mas como REPETICAO em ambiente de imagem
  #      minimalista diferente (glibc/pacotes distintos do runner
  #      ubuntu-latest completo), nao como cobertura nova de dash. Ver
  #      relatorio da fatia CI-2 para detalhe.
  #   2. Cada distro entrega uma versao de Python diferente (piso vs teto):
  #      medido localmente (2026-07-28) -- Debian 12-slim = Python 3.11.2,
  #      Fedora 41 = Python 3.13.9, Arch (rolling) = Python 3.14.6. O
  #      projeto escolheu config em INI/configparser (D-9) justamente para
  #      nao exigir 3.11+ (tomllib) -- este job prova o piso na pratica.
  #   3. Locale/encoding default variam entre distros, onde o invariante de
  #      round-trip byte-exato (D-6) e mais provavel de quebrar.
  #   4. Ordem explicita do lider ("quero debian, fedora, arch" +
  #      "acrescente, mas nao exclua ubuntu e windows"): a matriz de 5
  #      ambientes e requisito em si, independente do ganho marginal do
  #      item 1.
  #
  # Imagens minimalistas: SEM git nem python3 por padrao. Cada entrada da
  # matrix instala o que falta com o gerenciador de pacotes nativo (apt/
  # dnf/pacman) ANTES do checkout -- ver o motivo no step de instalacao.
  # Imagens pinadas por tag+digest (nao "latest" solto), pelo mesmo motivo
  # das actions abaixo serem pinadas por SHA: reprodutibilidade. Digest
  # capturado localmente em 2026-07-28 (`podman inspect <img> --format
  # '{{.Digest}}'`); arch:rolling nao publica tag versionada -- o digest e
  # a UNICA forma de fixar uma imagem reprodutivel dessa distro.
  # ---------------------------------------------------------------------
  test-distros:
    name: pytest (${{ matrix.distro }} via container)
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            # debian:12-slim (bookworm) -- /bin/sh e dash aqui, ao contrario
            # do bash usado em ubuntu-latest. Este e o motivo principal do
            # job: e o UNICO lugar da matrix onde os shims rodam sob dash.
            image: "docker.io/library/debian:12-slim@sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e"
            install: |
              apt-get update -qq
              apt-get install -y -qq python3 python3-venv git shellcheck
          - distro: fedora
            # fedora:41 -- release estavel numerada (nao rolling), tag
            # nao-movel por natureza (Fedora nao repontam um numero de
            # versao publicado).
            image: "docker.io/library/fedora:41@sha256:68bb1ba893be0c05991b2df55bc6571862bab7526fd6053b1ebacd53a2a75366"
            install: |
              dnf install -y -q python3 git shellcheck
          - distro: archlinux
            # archlinux:latest -- rolling release, SEM tag versionada
            # possivel; o digest acima e o unico jeito de fixar. `-Syu`
            # (nao so `-Sy`) evita "partial upgrade" (pacotes de bases
            # diferentes do repo), pratica recomendada pelo Arch Wiki para
            # containers efemeros que sincronizam o DB do zero a cada job.
            image: "docker.io/library/archlinux:latest@sha256:87465c3afdaede91333d4a9239d6a1ba7f47b2ec74b376e0070e81c25e7e3ff5"
            install: |
              pacman -Syu -q --noconfirm --needed python git shellcheck
    steps:
      - name: "Instalar git + python3 + shellcheck (imagem minimalista, nao vem por padrao)"
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "git safe.directory (checkout do runner-host + container root = dubious ownership)"
        # ACHADO (CI-2b, prova local 2026-08-16): job container roda como
        # root, mas o checkout que popula o workspace e feito com o UID do
        # runner-host (nao o root do container) -- dono do arquivo != euid
        # de quem le. Isso e EXATAMENTE o cenario que o git recusa desde a
        # correcao do CVE-2022-24765 ("dubious ownership"): qualquer
        # comando git no workspace falha com RC=128 e a mensagem "detected
        # dubious ownership in repository at '<path>'" ate o dono ser
        # marcado como seguro. `todo_lib.git()` (tools/todo_lib.py) engole
        # stderr e devolve "" em QUALQUER falha do subprocesso -- entao
        # `repo_root()` volta None e o sintoma observado no teste
        # (`test_dogfood_proprio_repo`) e o texto generico "Nao e um
        # repositorio git." (RC=1), nao o erro real do git.
        #
        # Reproduzido localmente (podman/docker): `archlinux:latest`,
        # bind-mount de um diretorio de dono uid=1000 (simulando o
        # runner-host) montado em container rodando como root (uid=0) --
        # sem este passo, `git rev-parse --show-toplevel` no diretorio
        # monta RC=128 ("dubious ownership"); com `git config --global
        # --add safe.directory` apontando so para o workspace do job,
        # RC=0. Suite completa confirmada verde nas duas condicoes depois
        # do passo (ver relatorio da fatia).
        #
        # So o workspace deste job (nao `safe.directory=*`, que marcaria
        # TODO diretorio do container como seguro -- amplo demais para o
        # que este job precisa).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Versao do Python neste ambiente (piso/teto de compatibilidade, D-9)"
        run: python3 --version

      - name: Instalar dependencias de teste (pytest, isolado em venv)
        # Debian/Fedora/Arch recentes marcam o Python de sistema como
        # "externally-managed" (PEP 668) -- pip install direto falha. Um
        # venv efemero em /tmp evita o guard e nao contamina o container.
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r requirements-dev.txt

      - name: pytest
        # ACHADO (CI-2, 2026-07-28): jobs de container do GitHub Actions
        # rodam como ROOT por padrao. Medido localmente: a mesma imagem
        # archlinux, mesma suite, so como root produz 1-3 falhas EXTRAS
        # alem das 2 do SPRAWL-1 (root ignora bit de permissao em cenario
        # que simula erro via chmod -- falso-positivo de ambiente, nao bug
        # de distro), e some rodando como usuario nao-root criado na hora.
        # Nao implementado aqui (privilege-drop portavel entre apt/dnf/
        # pacman e complexidade extra fora do pedido desta fatia -- Debian
        # tem /bin/su, Fedora minimal NAO tem su nem sudo por padrao). Se
        # este job mostrar falha alem das conhecidas do SPRAWL-1, checar
        # PRIMEIRO se e cenario de permissao/chmod antes de assumir bug
        # real da distro.
        run: /tmp/venv/bin/python -m pytest tests/ -v

      - name: "smoke dos shims sob /bin/sh REAL do container (dash no Debian)"
        # So no Debian: e o unico ambiente da matrix inteira (incluindo o
        # job Linux nativo abaixo, que roda em ubuntu-latest) onde vale a
        # pena provar de novo sob um /bin/sh que nao seja o mesmo do job
        # nativo -- ver motivo (1) no comentario do job acima.
        if: matrix.distro == 'debian'
        run: sh tools/ci/smoke_hooks.sh

  # ---------------------------------------------------------------------
  # Job 2: shellcheck + smoke dos shims. So-Linux, declarado: os shims de
  # tools/hooks/ sao POSIX sh (D-11/ADR-1 secao (e).2, degradacao
  # documentada no Windows -- dependem do shell do Git for Windows la, que
  # o runner windows-latest do GitHub nao fornece por padrao).
  # ---------------------------------------------------------------------
  shellcheck-and-smoke:
    name: shellcheck + smoke dos shims (so Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: shellcheck (_chain.sh + 7 shims + smoke script)
        # shellcheck vem pre-instalado na imagem ubuntu-latest do GitHub;
        # nenhuma action/instalacao extra necessaria.
        # --exclude=SC1091: o UNICO achado nos shims e "nao sigo o source
        # dinamico" (`. "$(dirname "$0")/_chain.sh"`), inevitavel por
        # desenho -- o caminho e resolvido em runtime via $0, nao e
        # estaticamente seguivel, e nao indica bug (medido localmente:
        # sem o exclude, EXIT=1 so por causa disso; com o exclude, EXIT=0).
        run: |
          shellcheck --exclude=SC1091 \
            tools/hooks/_chain.sh \
            tools/hooks/pre-commit \
            tools/hooks/commit-msg \
            tools/hooks/post-merge \
            tools/hooks/post-checkout \
            tools/hooks/prepare-commit-msg \
            tools/hooks/pre-push \
            tools/hooks/post-commit \
            tools/ci/smoke_hooks.sh

      - name: smoke dos shims (executa de verdade com sh)
        run: sh tools/ci/smoke_hooks.sh

  # ---------------------------------------------------------------------
  # Job 3: lint de Markdown nos .md versionados.
  # ---------------------------------------------------------------------
  markdown-lint:
    name: lint de Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: markdownlint-cli2
        # DavidAnson/markdownlint-cli2-action v24.1.0
        # Config em .markdownlint-cli2.yaml (raiz do repo, auto-descoberta
        # pela action): default:true + disable documentado por regra, e
        # ignore de tests/corpus/** (corpus sintetico deliberadamente
        # malformado da CORP-0 -- lintar prosa ali contradiz o proposito
        # do arquivo). ver comentarios no proprio arquivo de config.
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe
        with:
          globs: "**/*.md"

  # ---------------------------------------------------------------------
  # Job 4: gitleaks -- secrets no historico completo.
  # ---------------------------------------------------------------------
  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: gitleaks
        # gitleaks/gitleaks-action v3.0.0. Repo de conta PESSOAL (nao
        # organizacao): GITLEAKS_LICENSE nao e exigida (doc oficial do
        # projeto). GITHUB_TOKEN aqui e o token default de leitura deste
        # workflow (permissions: contents: read no topo) -- a action perde
        # a capacidade de comentar em PR (precisaria de pull-requests:
        # write), mas o gate real (falhar o job se achar segredo) nao
        # depende disso.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # Job 5: guards proprios do produto (CI-1) -- "so stdlib" e "anti-
  # vazamento de fixture real". Scripts em tools/ci/, os MESMOS que rodam
  # localmente (TST-T15 vai reusa-los no pre-CI).
  # ---------------------------------------------------------------------
  guards:
    name: guards (stdlib + anti-vazamento de fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: "Guard: nenhum import fora da stdlib em tools/"
        run: python3 tools/ci/guard_stdlib_imports.py tools

      - name: "Guard: anti-vazamento de fixture real (consumidores reais do lider)"
        run: python3 tools/ci/guard_no_real_fixtures.py
